  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="../data/favicon/favicon-32x32.png">

  <style>
    /* ===== VARIABLES — matches main page exactly ===== */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #0f0f0f;
      --bg-card: #141414;
      --bg-card-hover: #1a1a1a;
      --text-primary: #ffffff;
      --text-secondary: #b0a0a0;
      --text-tet: #c9b7b7;
      --text-muted: #705858;
      --accent: #c41e3a;
      --accent-bright: #e63950;
      --accent-glow: rgba(196, 30, 58, 0.15);
      --accent-deep: #8b1538;
      --accent-warm: #d4456a;
      --border: #222222;
      --border-hover: #333333;

      --font-display: 'Playfair Display SC', serif;
      --font-cursive: 'Pacifico', cursive;
      --font-nav: 'Cantarell', sans-serif;
      --font-body: 'DM Sans', -apple-system, sans-serif;

      --transition-fast: 0.15s ease;
      --transition-medium: 0.3s ease;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f2f2;
      --bg-card: #ffffff;
      --bg-card-hover: #faf5f5;
      --text-primary: #1a0505;
      --text-secondary: #3d2525;
      --text-tet: #c9b7b7;
      --text-muted: #6b5050;
      --accent: #9a1428;
      --accent-bright: #b81830;
      --accent-glow: rgba(154, 20, 40, 0.12);
      --accent-deep: #6e0f1e;
      --accent-warm: #c43858;
      --border: #d4c0c0;
      --border-hover: #b89898;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: hidden; max-width: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      font-size: 15px;
      transition: background var(--transition-medium), color var(--transition-medium);
    }

    a {
      color: var(--accent-bright);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    a:hover { color: var(--text-primary); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.1rem;
    }

    /* ===== HEADER — identical to main page ===== */
    .header {
      padding: 1.5rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      display: inline-flex;
      color: var(--text-primary);
      text-decoration: none;
    }

    .logo span {
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        color 0.3s ease, filter 0.3s ease;
      transition-delay: calc(var(--i) * 0.05s);
    }

    .logo:hover span {
      color: var(--accent);
      transform: translateY(-4px);
    }

    .header-right {
      position: absolute;
      right: 0;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== BACK LINK ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      transition: color var(--transition-fast);
    }

    .back-link:hover {
      color: var(--accent);
    }

    .back-link i {
      font-size: 0.75rem;
    }

    /* ===== PAGE TITLE — matches section-label style ===== */
    .page-header {
      margin-bottom: 2.5rem;
    }

    .page-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .page-title::after {
      content: '';
      width: 60px;
      height: 1px;
      background: var(--border);
    }

    .page-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* ===== FILTER TABS ===== */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .filter-tab {
      font-size: 0.75rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-body);
      transition: all var(--transition-fast);
    }

    .filter-tab:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ===== GALLERY GRID ===== */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 4rem;
    }

    /* ===== GALLERY ITEM ===== */
    .pic {
      position: relative;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: border-color var(--transition-fast);
    }

    .pic:hover {
      border-color: var(--border-hover);
    }

    .pic img,
    .pic video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      transition: transform 0.5s ease;
      display: block;
    }

    .pic:hover img,
    .pic:hover video {
      transform: scale(1.05);
    }

    /* Dark overlay on hover */
    .pic::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      border-radius: 4px;
      transition: background var(--transition-medium);
    }

    .pic:hover::after {
      background: rgba(0, 0, 0, 0.35);
    }

    /* ===== OVERLAY CONTAINER (hover swap) ===== */
    .overlay-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
    }

    .overlay-container img,
    .overlay-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      transition: transform 0.5s ease;
    }

    .overlay-container:hover img,
    .overlay-container:hover video {
      transform: scale(1.05);
    }

    .overlay-container .overlay-content {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay-container:hover .overlay-content {
      opacity: 1;
    }

    .overlay-container .overlay-content img,
    .overlay-container .overlay-content video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    /* ===== HIDDEN CLASS for filter ===== */
    .pic.hidden {
      display: none;
    }

    /* ===== LIGHTBOX ===== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      animation: zoomIn 0.25s ease;
      cursor: default;
    }

    .lightbox video.lightbox-video {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 4px;
      cursor: default;
    }

    .lightbox-close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      color: var(--text-secondary);
      font-size: 1.75rem;
      cursor: pointer;
      transition: color var(--transition-fast);
      line-height: 1;
    }

    .lightbox-close:hover {
      color: var(--accent);
    }

    /* ===== FOOTER — identical to main page ===== */
    .footer {
      padding: 3rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      color: var(--text-muted);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .footer .copyright-name {
      font-family: var(--font-display);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* ===== SCROLL ANIMATIONS ===== */
    .scroll-fade, .scroll-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .in-view.scroll-fade,
    .in-view.scroll-up {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-fade, .scroll-up { opacity: 1; transform: none; transition: none; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .container { padding: 0 1.25rem; }
      .logo { font-size: 2rem; }
      .photo-gallery { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
    }

    @media (max-width: 480px) {
      .logo { font-size: 1.8rem; }
      .photo-gallery { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
    }
  </style>
</head>

  <script>
    // ===== THEME =====
    function initTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      document.body.dataset.theme = saved;
      updateThemeIcon(saved);
    }

    function updateThemeIcon(theme) {
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    }

    function toggleTheme() {
      const newTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      document.body.dataset.theme = newTheme;
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    }

    // ===== SCROLL ANIMATIONS =====
    function initScrollAnimations() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

      document.querySelectorAll('.scroll-up, .scroll-fade').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight) {
          el.classList.add('in-view');
        } else {
          observer.observe(el);
        }
      });
    }

    // ===== FILTER TABS =====
    function initFilters() {
      const tabs = document.querySelectorAll('.filter-tab');
      const pics = document.querySelectorAll('.photo-gallery .pic');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          // Update active tab
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          const filter = tab.dataset.filter;

          pics.forEach(pic => {
            if (filter === 'all' || pic.classList.contains(filter)) {
              pic.classList.remove('hidden');
            } else {
              pic.classList.add('hidden');
            }
          });
        });
      });
    }

    // ===== LIGHTBOX =====
    function initLightbox() {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.querySelector('.lightbox-img');
      const lightboxClose = document.querySelector('.lightbox-close');

      // Open on click — only on non-overlay pics (overlay pics have their own hover)
      document.querySelectorAll('.photo-gallery .pic').forEach(pic => {
        pic.addEventListener('click', () => {
          // Get the primary visible image/video
          const overlay = pic.querySelector('.overlay-container');
          const media = overlay
            ? overlay.querySelector('img, video')
            : pic.querySelector('img, video');

          if (!media) return;

          // Remove any old lightbox video
          const oldVideo = lightbox.querySelector('.lightbox-video');
          if (oldVideo) oldVideo.remove();

          if (media.tagName === 'IMG') {
            lightboxImg.src = media.src;
            lightboxImg.style.display = 'block';
          } else if (media.tagName === 'VIDEO') {
            lightboxImg.style.display = 'none';
            const lbVideo = document.createElement('video');
            lbVideo.src = media.src;
            lbVideo.controls = true;
            lbVideo.autoplay = true;
            lbVideo.classList.add('lightbox-video');
            lightbox.appendChild(lbVideo);
          }

          lightbox.classList.add('open');
        });
      });

      // Close
      function closeLightbox() {
        lightbox.classList.remove('open');
        const lbVideo = lightbox.querySelector('.lightbox-video');
        if (lbVideo) { lbVideo.pause(); lbVideo.remove(); }
        lightboxImg.src = '';
      }

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', e => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeLightbox();
      });
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initScrollAnimations();
      initFilters();
      initLightbox();
    });
  </script>
